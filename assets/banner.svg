<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 400; font-size: 20px; fill: #e2e8f0; }
      .wave { animation: moveWave 3s ease-in-out infinite alternate; }
      @keyframes moveWave {
        0% { transform: translateY(0); }
        100% { transform: translateY(-10px); }
      }
      .pulse { animation: pulseAnim 2s infinite; }
      @keyframes pulseAnim {
        0% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
        100% { opacity: 0.8; transform: scale(1); }
      }
    </style>
  </defs>
  <rect width="800" height="200" rx="16" fill="url(#bg-grad)" />
  
  <g class="wave" transform="translate(650, 80)">
    <circle cx="0" cy="0" r="40" fill="#ffffff" fill-opacity="0.1" class="pulse"/>
    <circle cx="0" cy="0" r="25" fill="#ffffff" fill-opacity="0.2" />
    <path d="M-10,-5 L10,-5 L0,15 Z" fill="#ffffff" />
    <rect x="-15" y="-15" width="30" height="8" rx="2" fill="#ffffff" />
  </g>
  
  <g class="wave" transform="translate(550, 120)" style="animation-delay: 0.5s;">
    <circle cx="0" cy="0" r="30" fill="#ffffff" fill-opacity="0.1" class="pulse" style="animation-delay: 0.5s;" />
    <path d="M-8,-8 L8,8 M-8,8 L8,-8" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  </g>

  <g class="wave" transform="translate(720, 130)" style="animation-delay: 1s;">
    <rect x="-12" y="-12" width="24" height="24" rx="4" fill="#ffffff" fill-opacity="0.2" class="pulse" style="animation-delay: 1s;" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
  </g>

  <text x="50" y="90" class="title">Sales Pipeline Inspection</text>
  <text x="50" y="130" class="subtitle">Curated tools for revenue intelligence and deal tracking</text>
</svg>
